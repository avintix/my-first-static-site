<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Avintix Comply360</title>

<style>
body{margin:0;font-family:Segoe UI;background:#F4F7FB;}
.header{
background:#0B3C5D;color:white;padding:15px 25px;
display:flex;justify-content:space-between;align-items:center;
}
.layout{display:flex;height:calc(100vh - 60px);}
.sidebar{
width:240px;background:#082C45;color:white;padding-top:20px;
}
.sidebar button{
width:90%;margin:8px 5%;padding:10px;
background:none;border:1px solid #1D9BF0;
color:white;border-radius:6px;text-align:left;cursor:pointer;
}
.sidebar button:hover{background:#1D9BF0;}
.content{flex:1;padding:20px;overflow:auto;}
.card{
background:white;padding:15px;border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:20px;
}
.card-title{font-weight:600;color:#0B3C5D;margin-bottom:10px;}
.question{
background:#f9f9f9;padding:10px;margin:8px 0;border-radius:6px;
}
.toggle{font-size:12px;color:#1D9BF0;cursor:pointer;margin-right:10px;}
.hidden{display:none;}
select,input,textarea{
width:100%;padding:6px;margin-top:5px;
border-radius:6px;border:1px solid #ccc;
}
button.primary{
background:#1D9BF0;border:none;color:white;
padding:8px 12px;border-radius:6px;cursor:pointer;margin-top:8px;
}
button.primary:hover{background:#0B3C5D;}
.section{display:none;}
.active{display:block;}
.heatbox{
display:inline-block;width:160px;padding:12px;margin:5px;
border-radius:8px;color:white;text-align:center;font-weight:600;
}
.green{background:#2ECC71;}
.yellow{background:#F39C12;}
.red{background:#E74C3C;}
.blue{background:#1D9BF0;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #ddd;padding:6px;font-size:13px;}
</style>
</head>

<body>

<div class="header">
<div><b>AVINTIX | Comply360</b></div>
<select id="standardSelect">
<option value="ISO 9001">ISO 9001</option>
</select>
</div>

<div class="layout">

<div class="sidebar">
<button onclick="showSection('dashboard')">Dashboard</button>
<button onclick="showSection('audit')">Audit Engine</button>
<button onclick="showSection('capa')">CAPA Tracker</button>
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<div class="card">
<div class="card-title">Executive Dashboard</div>

<select id="customerDropdown" onchange="loadVersions()">
<option value="">-- Select Customer --</option>
</select>

<select id="versionDropdown" onchange="renderDashboard()"></select>

<div id="dashboardContent"></div>

<button class="primary" onclick="exportAuditPDF()">Export Audit PDF</button>

</div>
</div>

<!-- AUDIT -->
<div id="audit" class="section">
<div class="card">
<div class="card-title">Customer</div>
<input id="customerName" placeholder="Customer Name">
<button class="primary" onclick="createCustomer()">Create</button>
</div>

<div class="card">
<div class="card-title">ISO Audit</div>
<div id="auditForm"></div>
<button class="primary" onclick="saveAudit()">Save Version</button>
</div>
</div>

<!-- CAPA -->
<div id="capa" class="section">
<div class="card">
<div class="card-title">CAPA Tracker</div>

<label>Clause</label>
<input id="capaClause">
<label>Description</label>
<textarea id="capaDesc"></textarea>
<label>Owner</label>
<input id="capaOwner">
<label>Target Date</label>
<input type="date" id="capaDate">

<button class="primary" onclick="addCAPA()">Add CAPA</button>

<div id="capaList"></div>

</div>
</div>

</div>
</div>

<script type="module">

import { iso9001 } from "./modules/iso9001.js";

let currentModule = iso9001;

/* ---------------- NAVIGATION ---------------- */
window.showSection = function(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* ---------------- STORAGE ---------------- */
function getData(){
return JSON.parse(localStorage.getItem("comply_core"))||{customers:{}};
}
function saveData(d){
localStorage.setItem("comply_core",JSON.stringify(d));
}

/* ---------------- BUILD FORM ---------------- */
function buildAuditForm(){

let html="";
currentModule.questions.forEach((q,i)=>{
html+=`
<div class="question">
<b>${q.clause} – ${q.title}</b><br>
${q.question}<br>

<span class="toggle" onclick="toggle('ev${i}')">Evidence</span>
<span class="toggle" onclick="toggle('ex${i}')">Example</span>

<div id="ev${i}" class="hidden"><b>Evidence:</b> ${q.evidence}</div>
<div id="ex${i}" class="hidden"><b>Example:</b> ${q.example}</div>

<select class="answer">
<option value="2">Yes</option>
<option value="1">Partial</option>
<option value="0">No</option>
</select>
<textarea placeholder="Comment"></textarea>
</div>`;
});
document.getElementById("auditForm").innerHTML=html;
}
window.toggle=function(id){
document.getElementById(id).classList.toggle("hidden");
}
buildAuditForm();

/* ---------------- CUSTOMER ---------------- */
window.createCustomer=function(){
let name=document.getElementById("customerName").value.trim();
if(!name)return;
let d=getData();
if(!d.customers[name])d.customers[name]={versions:[]};
saveData(d);
populateCustomers();
}
function populateCustomers(){
let d=getData();
let dd=document.getElementById("customerDropdown");
dd.innerHTML='<option value="">-- Select Customer --</option>';
Object.keys(d.customers).forEach(c=>{
let o=document.createElement("option");
o.value=c;o.text=c;dd.appendChild(o);
});
}
populateCustomers();

/* ---------------- SAVE AUDIT ---------------- */
window.saveAudit=function(){

let customer=document.getElementById("customerDropdown").value;
if(!customer)return alert("Select customer");

let d=getData();
let answers=document.querySelectorAll(".answer");
let comments=document.querySelectorAll("textarea");

let total=0,max=0,weightedTotal=0,weightedMax=0;
let major=0,minor=0;
let clauseScores={};
let answerList=[];

currentModule.questions.forEach((q,i)=>{

let score=parseInt(answers[i].value);
let root=q.clause.split(".")[0];
let weight=currentModule.weights[root]||1;

total+=score; max+=2;
weightedTotal+=score*weight;
weightedMax+=2*weight;

if(!clauseScores[q.clause])clauseScores[q.clause]={total:0,count:0};
clauseScores[q.clause].total+=score;
clauseScores[q.clause].count++;

if(score===0)major++;
if(score===1)minor++;

answerList.push({
clause:q.clause,
score:score,
comment:comments[i].value
});

});

let rawScore=Math.round((total/max)*100);
let weightedScore=Math.round((weightedTotal/weightedMax)*100);

let version={
timestamp:Date.now(),
rawScore,weightedScore,
major,minor,
clauseScores,
answers:answerList,
capa:[]
};

d.customers[customer].versions.push(version);
saveData(d);

loadVersions();
renderDashboard();
}

/* ---------------- LOAD VERSIONS ---------------- */
function loadVersions(){
let customer=document.getElementById("customerDropdown").value;
if(!customer)return;
let d=getData();
let versions=d.customers[customer].versions;

let vd=document.getElementById("versionDropdown");
vd.innerHTML="";
versions.forEach((v,i)=>{
let o=document.createElement("option");
o.value=i;
o.text=new Date(v.timestamp).toLocaleDateString()+" - "+v.weightedScore+"%";
vd.appendChild(o);
});
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
let customer=document.getElementById("customerDropdown").value;
if(!customer)return;
let d=getData();
let versions=d.customers[customer].versions;
let idx=parseInt(document.getElementById("versionDropdown").value);
let v=versions[idx];
let prev=versions[idx-1];

let trend="";
if(prev){
let diff=v.weightedScore-prev.weightedScore;
if(diff>0)trend=" ▲ +"+diff+"%";
if(diff<0)trend=" ▼ "+diff+"%";
}

let html=`
<div class="heatbox green">Raw<br>${v.rawScore}%</div>
<div class="heatbox blue">Weighted<br>${v.weightedScore}% ${trend}</div>
<div class="heatbox yellow">Major<br>${v.major}</div>
<div class="heatbox red">Minor<br>${v.minor}</div>
`;
document.getElementById("dashboardContent").innerHTML=html;
renderCAPA();
}

/* ---------------- CAPA ---------------- */
window.addCAPA=function(){
let customer=document.getElementById("customerDropdown").value;
let d=getData();
let idx=parseInt(document.getElementById("versionDropdown").value);
let v=d.customers[customer].versions[idx];

v.capa.push({
clause:document.getElementById("capaClause").value,
desc:document.getElementById("capaDesc").value,
owner:document.getElementById("capaOwner").value,
target:document.getElementById("capaDate").value,
status:"Open"
});
saveData(d);
renderCAPA();
}
function renderCAPA(){
let customer=document.getElementById("customerDropdown").value;
if(!customer)return;
let d=getData();
let idx=parseInt(document.getElementById("versionDropdown").value);
let v=d.customers[customer].versions[idx];

let html="<table><tr><th>Clause</th><th>Description</th><th>Owner</th><th>Target</th><th>Status</th></tr>";
v.capa.forEach(c=>{
html+=`<tr><td>${c.clause}</td><td>${c.desc}</td><td>${c.owner}</td><td>${c.target}</td><td>${c.status}</td></tr>`;
});
html+="</table>";
document.getElementById("capaList").innerHTML=html;
}

</script>
</body>
</html>
