<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Avintix Comply360</title>

<style>
body{margin:0;font-family:Segoe UI;background:#F4F7FB;}
.header{
background:#0B3C5D;color:white;padding:15px 25px;
display:flex;justify-content:space-between;align-items:center;
}
.layout{display:flex;height:calc(100vh - 60px);}
.sidebar{
width:220px;background:#082C45;color:white;padding-top:20px;
}
.sidebar button{
width:90%;margin:8px 5%;padding:10px;
background:none;border:1px solid #1D9BF0;
color:white;border-radius:6px;text-align:left;cursor:pointer;
}
.sidebar button:hover{background:#1D9BF0;}
.content{flex:1;padding:20px;overflow:auto;}
.card{
background:white;padding:15px;border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:20px;
}
.question{
background:#f9f9f9;padding:10px;margin:8px 0;border-radius:6px;
}
.toggle{font-size:12px;color:#1D9BF0;cursor:pointer;margin-right:10px;}
.hidden{display:none;}
select,input,textarea{
width:100%;padding:6px;margin-top:5px;
border-radius:6px;border:1px solid #ccc;
}
button.primary{
background:#1D9BF0;color:white;border:none;
padding:8px 12px;border-radius:6px;margin-top:8px;
}
button.primary:hover{background:#0B3C5D;}
.section{display:none;}
.active{display:block;}
</style>
</head>

<body>

<div class="header">
<div><b>AVINTIX | Comply360</b></div>

<select id="standardSelect">
<option value="ISO 9001">ISO 9001</option>
<option value="ISO 27001:2023">ISO 27001:2023</option>
</select>

</div>

<div class="layout">

<div class="sidebar">
<button onclick="showSection('audit')">Audit Engine</button>
</div>

<div class="content">

<div id="audit" class="section active">
<div class="card">
<h3>Audit Questions</h3>
<div id="auditForm"></div>
</div>
</div>

</div>
</div>

<script type="module">

import { iso9001 } from "./modules/iso9001.js";
import { iso27001 } from "./modules/iso27001.js";

const modules = {
  "ISO 9001": iso9001,
  "ISO 27001:2023": iso27001
};

let currentModule = iso9001;

document.getElementById("standardSelect").addEventListener("change", (e)=>{
  currentModule = modules[e.target.value];
  buildAuditForm();
});

function buildAuditForm(){

  let questions = currentModule.questions;
  let html = "";

  questions.forEach((q,i)=>{
    html += `
    <div class="question">
      <b>${q.clause} – ${q.title}</b><br>
      ${q.question}<br>

      <span class="toggle" onclick="toggle('ev${i}')">Evidence</span>
      <span class="toggle" onclick="toggle('ex${i}')">Example</span>

      <div id="ev${i}" class="hidden"><b>Evidence:</b> ${q.evidence}</div>
      <div id="ex${i}" class="hidden"><b>Example:</b> ${q.example}</div>

      <select>
        <option value="2">Yes</option>
        <option value="1">Partial</option>
        <option value="0">No</option>
      </select>

      <textarea placeholder="Comment"></textarea>
    </div>`;
  });

  document.getElementById("auditForm").innerHTML = html;
}

window.toggle = function(id){
  document.getElementById(id).classList.toggle("hidden");
}

buildAuditForm();

</script>

</body>
</html>
