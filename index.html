<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Avintix Comply360 Enterprise</title>

<style>
body{margin:0;font-family:Segoe UI;background:#F4F7FB;}
.header{
background:#0B3C5D;color:white;padding:15px 25px;
display:flex;justify-content:space-between;align-items:center;
}
.logo{font-weight:bold;font-size:18px;}
.standard-select{
background:#1D9BF0;border:none;color:white;
padding:6px 10px;border-radius:6px;
}
.layout{display:flex;height:calc(100vh - 60px);}
.sidebar{
width:230px;background:#082C45;color:white;padding-top:20px;
}
.sidebar button{
width:90%;margin:8px 5%;padding:10px;
background:none;border:1px solid #1D9BF0;
color:white;border-radius:6px;text-align:left;cursor:pointer;
}
.sidebar button:hover{background:#1D9BF0;}
.content{flex:1;padding:20px;overflow:auto;}
.card{
background:white;padding:15px;border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:20px;
}
.card-title{font-weight:600;color:#0B3C5D;margin-bottom:10px;}
input,select,textarea{
width:100%;padding:6px;margin-top:5px;
border-radius:6px;border:1px solid #ccc;
}
button.primary{
background:#1D9BF0;border:none;color:white;
padding:8px 12px;border-radius:6px;cursor:pointer;margin-top:8px;
}
button.primary:hover{background:#0B3C5D;}
.section{display:none;}
.active{display:block;}
.question{
background:#f9f9f9;padding:8px;margin:6px 0;border-radius:6px;
}
.evidence{font-size:12px;color:#555;margin-top:4px;display:none;}
.heatbox{
display:inline-block;width:140px;padding:12px;
margin:5px;border-radius:8px;color:white;text-align:center;
font-weight:600;
}
.green{background:#2ECC71;}
.yellow{background:#F39C12;}
.red{background:#E74C3C;}
.blue{background:#1D9BF0;}
</style>
</head>

<body>

<div class="header">
<div class="logo">AVINTIX | Comply360</div>
<select class="standard-select">
<option>ISO 9001</option>
</select>
</div>

<div class="layout">

<div class="sidebar">
<button onclick="showSection('dashboard')">Dashboard</button>
<button onclick="showSection('audit')">Audit Engine</button>
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<div class="card">
<div class="card-title">Executive Dashboard</div>

<select id="customerDropdown" onchange="loadVersions()">
<option value="">-- Select Customer --</option>
</select>

<select id="versionDropdown" onchange="renderDashboard()"></select>

<div id="dashboardContent"></div>

</div>
</div>

<!-- AUDIT -->
<div id="audit" class="section">

<div class="card">
<div class="card-title">Customer</div>
<input id="customerName" placeholder="Customer Name">
<button class="primary" onclick="createCustomer()">Create</button>
</div>

<div class="card">
<div class="card-title">ISO 9001 Structured Audit</div>
<div id="auditForm"></div>
<button class="primary" onclick="saveAudit()">Save Version</button>
</div>

</div>

</div>
</div>

<script>

function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// ---------------- DATA ----------------
function getData(){
return JSON.parse(localStorage.getItem("comply_risk"))||{customers:{}};
}
function saveData(d){
localStorage.setItem("comply_risk",JSON.stringify(d));
}

// ---------------- RISK WEIGHTS ----------------
const clauseWeights={
"4":1.1,
"5":1.3,
"6":1.4,
"7":1.0,
"8":1.3,
"9":1.2,
"10":1.3
};

// ---------------- ISO QUESTIONS ----------------
const isoQuestions=[
{clause:"4.1",title:"Context",q:"Has organization identified internal & external issues?",e:"SWOT, risk analysis"},
{clause:"5.1",title:"Leadership",q:"Does top management demonstrate commitment?",e:"Meeting minutes"},
{clause:"6.1",title:"Risk Planning",q:"Are risks identified and mitigated?",e:"Risk register"},
{clause:"7.5",title:"Document Control",q:"Are documents controlled?",e:"Doc control procedure"},
{clause:"8.2",title:"Customer Requirements",q:"Are customer requirements reviewed?",e:"Contract review"},
{clause:"9.2",title:"Internal Audit",q:"Are audits conducted periodically?",e:"Audit program"},
{clause:"10.2",title:"Corrective Action",q:"Are root causes identified?",e:"RCA report"}
];

// duplicate to 35+ questions
while(isoQuestions.length<35){
isoQuestions.push({...isoQuestions[isoQuestions.length%7]});
}

// Build form
let form="";
isoQuestions.forEach((q,i)=>{
form+=`
<div class="question">
<b>${q.clause} – ${q.title}</b><br>
${q.q}
<br>
<button type="button" onclick="toggleEvidence(${i})">Show Evidence</button>
<div id="ev${i}" class="evidence">${q.e}</div>
<select class="answer">
<option value="2">Yes</option>
<option value="1">Partial</option>
<option value="0">No</option>
</select>
<textarea placeholder="Comment"></textarea>
</div>`;
});
document.getElementById("auditForm").innerHTML=form;

function toggleEvidence(i){
let el=document.getElementById("ev"+i);
el.style.display=el.style.display==="none"?"block":"none";
}

// ---------------- CUSTOMER ----------------
function createCustomer(){
let name=document.getElementById("customerName").value.trim();
if(!name)return;
let d=getData();
if(!d.customers[name])d.customers[name]=[];
saveData(d);
populateCustomers();
}

function populateCustomers(){
let d=getData();
let dd=document.getElementById("customerDropdown");
dd.innerHTML='<option value="">-- Select Customer --</option>';
Object.keys(d.customers).forEach(c=>{
let o=document.createElement("option");
o.value=c;o.text=c;dd.appendChild(o);
});
}
populateCustomers();

// ---------------- SAVE AUDIT ----------------
function saveAudit(){
let customer=document.getElementById("customerDropdown").value;
if(!customer)return alert("Select customer");

let d=getData();
let answers=document.querySelectorAll(".answer");

let total=0,max=0;
let weightedTotal=0,weightedMax=0;
let clauseScores={};
let major=0,minor=0;

isoQuestions.forEach((q,i)=>{
let score=parseInt(answers[i].value);
let root=q.clause.split(".")[0];
let weight=clauseWeights[root]||1;

total+=score;
max+=2;

weightedTotal+=score*weight;
weightedMax+=2*weight;

if(!clauseScores[q.clause])
clauseScores[q.clause]={total:0,count:0};

clauseScores[q.clause].total+=score;
clauseScores[q.clause].count++;

if(score===0)major++;
if(score===1)minor++;
});

let rawScore=Math.round((total/max)*100);
let weightedScore=Math.round((weightedTotal/weightedMax)*100);

let version={
timestamp:Date.now(),
rawScore:rawScore,
weightedScore:weightedScore,
clauseScores:clauseScores,
major:major,
minor:minor
};

d.customers[customer].push(version);
saveData(d);

loadVersions();
renderDashboard();
}

// ---------------- VERSION ----------------
function loadVersions(){
let customer=document.getElementById("customerDropdown").value;
if(!customer)return;
let d=getData();
let versions=d.customers[customer];

let vd=document.getElementById("versionDropdown");
vd.innerHTML="";

versions.sort((a,b)=>b.timestamp-a.timestamp);

versions.forEach((v,i)=>{
let o=document.createElement("option");
o.value=i;
o.text=new Date(v.timestamp).toLocaleDateString()+" - "+v.weightedScore+"%";
vd.appendChild(o);
});
}

// ---------------- DASHBOARD ----------------
function renderDashboard(){
let customer=document.getElementById("customerDropdown").value;
if(!customer)return;

let d=getData();
let versions=d.customers[customer];
let idx=document.getElementById("versionDropdown").value;
let v=versions[idx];
let prev=versions[parseInt(idx)+1];

let trend="";
if(prev){
let diff=v.weightedScore-prev.weightedScore;
if(diff>0)trend=" ▲ +"+diff+"%";
if(diff<0)trend=" ▼ "+diff+"%";
}

let html=`
<div class="heatbox green">
Raw Score<br>${v.rawScore}%
</div>
<div class="heatbox blue">
Risk Weighted<br>${v.weightedScore}% ${trend}
</div>
<div class="heatbox yellow">
Major NCR<br>${v.major}
</div>
<div class="heatbox red">
Minor NCR<br>${v.minor}
</div>
<h4>Clause Heatmap</h4>
`;

Object.keys(v.clauseScores).forEach(c=>{
let percent=Math.round((v.clauseScores[c].total/(v.clauseScores[c].count*2))*100);
let cls=percent>=85?"green":percent>=70?"yellow":"red";
html+=`<div class="heatbox ${cls}">${c}<br>${percent}%</div>`;
});

document.getElementById("dashboardContent").innerHTML=html;
}

</script>
</body>
</html>
